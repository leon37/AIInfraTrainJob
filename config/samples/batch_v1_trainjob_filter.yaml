apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: job-filter
  namespace: default
spec:
  queueName: team-a     # 指向上面那个队列
  worldSize: 2          # 2 个 worker
  retryLimit: 0
  image: busybox:1.36
  command: ["sleep", "3600"]   # 让它一直占着资源,方便你观察
  masterPort: 29500
  schedulerName: my-custom-scheduler
  scheduleMaxCount: 2
  priorityClassName: high-priority
  resources:
    requests:
      cpu: "5"          # 每 worker 1 核 → 整份作业 2×1 = 2 核 = 占满配额