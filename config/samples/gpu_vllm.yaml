apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen2.5-1.5B-Instruct
            - --served-model-name
            - Qwen/Qwen2.5-1.5B-Instruct
            - --max-model-len
            - "32768"
            - --dtype
            - bfloat16
            - --gpu-memory-utilization
            - "0.9"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: llm-storage
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
      volumes:
        - name: llm-storage
          hostPath:
            path: /data/hf-cache
            type: "DirectoryOrCreate"
        - name: dshm
          emptyDir:
            medium: "Memory"
            sizeLimit: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-server
spec:
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP