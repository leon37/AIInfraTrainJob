apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: m2-nccl-ddp
  namespace: default
spec:
  queueName: team-gpu
  worldSize: 2
  retryLimit: 0
  image: aiinfra-ddp:cu128
  masterPort: 29500
  command:
    - sh
    - -c
    - |
      NCCL_DEBUG=INFO python /app/experiments/03_ddp_minimal.py
  resources:
    requests:
      nvidia.com/gpu: "1"
    limits:
      nvidia.com/gpu: "1"
