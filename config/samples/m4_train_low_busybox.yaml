apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: train-low-gpu
  namespace: default
spec:
  queueName: team-gpu
  worldSize: 2
  retryLimit: 0
  schedulerName: my-custom-scheduler
  priorityClassName: low-priority
  scheduleTimeoutSeconds: 300
  image: busybox:1.36
  command: [ "sleep", "3600" ]
  masterPort: 29500
  resources:
    requests:
      nvidia.com/gpu: "1"
    limits:
      nvidia.com/gpu: "1"