apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: job-low
  namespace: default
spec:
  queueName: team-a
  worldSize: 2
  retryLimit: 0
  image: busybox:1.36
  command: ["sleep", "3600"]
  masterPort: 29500
  priorityClassName: low-priority
  resources:
    requests:
      cpu: "5"          # 同样要 2 核,但配额已被 job-high 占光