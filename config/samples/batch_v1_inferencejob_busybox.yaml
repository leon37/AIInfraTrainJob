apiVersion: batch.example.com/v1
kind: InferenceJob
metadata:
  name: inference-busybox
  namespace: default
spec:
  queueName: team-a # 配额/requeue
  schedulerName: my-custom-scheduler # 抢占
  priorityClassName: high-priority # 抢占
  maxRestarts: 1
  image: busybox:1.36
  command: ["sleep", "86400"]
  resources: # 抢占
    requests:
      example.com/gpu: "1"
    limits:
      example.com/gpu: "1"
