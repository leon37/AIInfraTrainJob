apiVersion: v1
kind: Pod
metadata:
  name: single-pod-c-sizes
  namespace: default
spec:
  containers:
    - name: single-pod-c-sizes
      image: aiinfra-ddp:cu128
      command:
        - sh
        - -c
        - |
          port=29501
          for n in 1000 100000 1000000 10000000 50000000; do
            echo "== numel=$n port=$port"
            PG_TIMEOUT=120 NCCL_DEBUG=INFO \
            env -u RANK -u WORLD_SIZE -u LOCAL_RANK -u MASTER_ADDR -u MASTER_PORT \
              torchrun --nnodes=1 --nproc_per_node=2 \
                --master_addr=127.0.0.1 --master_port=$port \
                /app/experiments/06_all_reduce_payload.py --steps 20 --numel $n
            port=$((port + 1))
          done
      resources:
        requests:
          nvidia.com/gpu: "2"
        limits:
          nvidia.com/gpu: "2"
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
  volumes:
    - name: dshm
      emptyDir:
        medium: "Memory"
        sizeLimit: "1Gi"
  restartPolicy: "Never"
