# M3 阶段 B · B6：一个 Pod 占 2 卡，跑 torchrun --nproc_per_node=2
#
# 唯一能补掉 GPU互联与通信.md 第九节那个软肋（"你量过 P2P 到底能到多少吗"）的实验。
# 一个 Pod 里两个 rank 在【同一个 network namespace】、device_count=2
#   → NCCL 知道它们是同机的，不会再退回 NET/Socket
#
# ⚠️ 【但走 P2P 还是走 SHM 是未知的，别预设】：
#    A10 是 PHB 互联，P2P 到底可不可用【要看 A1 的 nvidia-smi topo -p2p r 输出】——
#    那正是 GPU互联与通信.md 里挂了很久的那条"没验证"。
#      P2P 可用  → NCCL 日志出现 P2P/direct pointer 一类的 transport
#      P2P 不可用 → 退回 SHM（共享内存），仍然远快于跨 Pod 的 NET/Socket
#    两种都比 4.3 GB/s 快，但【机制不同，看日志确认走的是哪条】，别写死结论。
#
# 对照：pod-per-worker 的 4.3 GB/s（M2 实测）。预期有明显提升。
#
# ⚠️ 这里 worldSize=1 是【TrainJob 层面只起一个 Pod】，Pod 内的两个 rank 由 torchrun 拉起。
#    别和 m3_crossnode_4.yaml 的 worldSize=4 混淆——那是 4 个 Pod 各 1 卡。
#
# ⚠️ env -u 是【防御措施，未实测验证】：控制器会给 Pod 注入 RANK=0 / WORLD_SIZE=1 / LOCAL_RANK=0 /
#    MASTER_ADDR（ClusterIP Service）/ MASTER_PORT，这些会和 torchrun 自己的
#    rendezvous 打架。清掉它们，让 torchrun 完全自己做主，走 127.0.0.1。
#    master_port 用 29501 而不是 29500，避开控制器那个 Service 的端口。
#
# 对照组：把 command 里的 torchrun 前面加 NCCL_P2P_DISABLE=1 再跑一次，
#         两个数一比就知道 P2P 到底值多少。
#
# ⚠️ 【故意不写 schedulerName / priorityClassName，走 default scheduler】
#    这份 worldSize=1，只有一个 Pod，【gang 语义本来就不适用】——
#    gang 要解决的是"多个 Pod 要么全起要么全不起"，单 Pod 没有这个问题。
#    走自定义调度器只会多一层排查面，没有任何收益。
apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: m3-p2p-single-pod
  namespace: default
spec:
  queueName: team-gpu
  worldSize: 1
  retryLimit: 0
  # default scheduler 下这个字段没人读（自定义插件不参与），留着是为了将来
  # 切回 my-custom-scheduler 时不用再加。控制器仍会把它写进 PodGroup。
  scheduleTimeoutSeconds: 120
  image: aiinfra-ddp:cu128
  masterPort: 29500
  command:
    - sh
    - -c
    - |
      PG_TIMEOUT=120 NCCL_DEBUG=INFO \
      env -u RANK -u WORLD_SIZE -u LOCAL_RANK -u MASTER_ADDR -u MASTER_PORT \
        torchrun --nnodes=1 --nproc_per_node=2 \
          --master_addr=127.0.0.1 --master_port=29501 \
          /app/experiments/06_all_reduce_payload.py --steps 10 --numel 10000000
  resources:
    requests:
      nvidia.com/gpu: "2"
    limits:
      nvidia.com/gpu: "2"
