# M3 第 11 步：跨节点带宽，worldSize=4
#
# GPU互联与通信.md 第七节「跨节点带宽」整节空白，这是第一个数。
#
# 注意 worldSize=4 时 2(n-1)/n = 1.5，【algbw 和 busbw 第一次不相等】，两个数都要记：
#   algbw = 40MB / 单步耗时          ← 程序跑多快
#   busbw = algbw × 1.5              ← 硬件用得多满，【拿这个和内网网卡标称值比】
#
# 对照：M2 单节点双卡 algbw ≈ 4.3 GB/s（n=2，系数为 1，两个数恰好相等）。
#
# ⚠️ 【故意不写 schedulerName / priorityClassName，走 default scheduler】
#    第 8 步的单节点基线用的是 m2_nccl_ddp.yaml，那份也是 default scheduler。
#    如果这里换成 my-custom-scheduler，从第 8 步到第 9 步就【同时变了两个变量】
#    （单节点→跨节点、default→自定义），失败时不知道该怀疑网络还是调度器，
#    而这一步本来就是 M3 最可能反复的一步，基线对照的意义会废掉一半。
#    gang 的跨节点行为：本地 kind 已验过（worldSize=4 两节点各 2 rank），
#    真 GPU 上由第 10 步（m2_gang_fail.yaml，走自定义调度器）再验一次。
apiVersion: batch.example.com/v1
kind: TrainJob
metadata:
  name: m3-bandwidth-4
  namespace: default
spec:
  queueName: team-gpu
  worldSize: 4
  retryLimit: 0
  # default scheduler 下这个字段没人读（自定义插件不参与），留着是为了将来
  # 切回 my-custom-scheduler 时不用再加。控制器仍会把它写进 PodGroup。
  scheduleTimeoutSeconds: 120
  image: aiinfra-ddp:cu128
  masterPort: 29500
  command:
    - sh
    - -c
    - |
      PG_TIMEOUT=120 NCCL_DEBUG=INFO python /app/experiments/06_all_reduce_payload.py \
        --steps 10 --numel 10000000
  resources:
    requests:
      nvidia.com/gpu: "1"
    limits:
      nvidia.com/gpu: "1"
