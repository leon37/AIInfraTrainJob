apiVersion: batch.example.com/v1
kind: InferenceJob
metadata:
  name: inference-vllm
  namespace: default
spec:
  queueName: team-gpu
  schedulerName: my-custom-scheduler
  priorityClassName: high-priority
  maxRestarts: 1
  image: vllm/vllm-openai:v0.29.0
  command: [ "vllm", "serve" ]
  args:
    - Qwen/Qwen2.5-1.5B-Instruct
    - --served-model-name
    - Qwen/Qwen2.5-1.5B-Instruct
    - --max-model-len
    - "32768"
    - --dtype
    - bfloat16
    - --gpu-memory-utilization
    - "0.9"
  volumeMounts:
    - name: llm-storage
      mountPath: /root/.cache/huggingface
  volumes:
    - name: llm-storage
      hostPath:
        path: /data/hf-cache
        type: "DirectoryOrCreate"
  resources:
    requests:
      nvidia.com/gpu: "1"
    limits:
      nvidia.com/gpu: "1"
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  startupProbe:
    httpGet:
      path: /health
      port: 8000
    periodSeconds: 10
    failureThreshold: 30
